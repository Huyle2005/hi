<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - IUH Smart Parking System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 h-screen flex items-center justify-center font-sans">
    <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <div class="w-16 h-16 bg-blue-900 text-white rounded-2xl flex items-center justify-center font-bold text-xl mx-auto shadow-lg">
                IUH
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Đăng Nhập Hệ Thống</h1>
            <p class="text-xs text-slate-500">Trung Tâm Vận Hành Quản Lý Xe & Tài Xế</p>
        </div>

        <div id="error-alert" class="hidden p-3 bg-red-100 border border-red-300 text-red-700 text-xs rounded-lg"></div>

        <form id="login-form" class="space-y-4" autocomplete="off">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">TÀI KHOẢN</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-3 top-3 text-slate-400 text-xs"></i>
                    <input type="text" id="username" placeholder="Nhập tài khoản (admin)..." autocomplete="off" class="w-full pl-9 pr-4 py-2 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-blue-600" required>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">MẬT KHẨU</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3 top-3 text-slate-400 text-xs"></i>
                    <input type="password" id="password" placeholder="Nhập mật khẩu (admin@1234)..." autocomplete="new-password" class="w-full pl-9 pr-4 py-2 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-blue-600" required>
                </div>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-lg shadow-blue-600/30">
                ĐĂNG NHẬP HỆ THỐNG
            </button>
        </form>

        <div class="text-center text-[11px] text-slate-400 border-t pt-4">
            Industrial University of Ho Chi Minh City © 2026
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('error-alert');
            alertBox.classList.add('hidden');

            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                })
            });

            const data = await res.json();
            if (data.success) {
                window.location.href = data.redirect;
            } else {
                alertBox.innerText = data.message;
                alertBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
