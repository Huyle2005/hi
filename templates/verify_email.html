<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xác minh email</title>
    <style>
        body {
            font-family: Arial;
            background: #eff6ff;
            min-height: 100vh;
            display: grid;
            place-items: center;
            margin: 0;
            padding: 20px
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
            box-shadow: 0 8px 30px #0001
        }

        h2 {
            text-align: center;
            color: #1d4ed8
        }

        p {
            text-align: center;
            color: #64748b
        }

        input,
        button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border-radius: 8px;
            font-size: 16px
        }

        input {
            border: 1px solid #cbd5e1
        }

        button {
            border: 0;
            background: #2563eb;
            color: white;
            cursor: pointer
        }

        #msg {
            margin-top: 14px;
            text-align: center;
            font-size: 14px
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Xác minh email</h2>
        <p>Nhập email của bạn để nhận mã xác minh.</p>
        <input id="email" type="email" placeholder="Nhập email của bạn" autocomplete="email" required>
        <button id="send" type="button">Gửi mã xác minh</button>
        <input id="otp" inputmode="numeric" maxlength="6" placeholder="Nhập mã OTP 6 số">
        <button id="verify" type="button">Xác minh email</button>
        <div id="msg" role="status"></div>
    </div>
    <script>
        const msg = document.getElementById('msg');
        document.getElementById('send').onclick = async () => {
            try {
                const r = await fetch('/send-login-otp', { method: 'POST' });
                const d = await r.json(); msg.textContent = d.message || 'Có lỗi xảy ra.';
                if (r.ok && d.success) msg.style.color = 'green'; else msg.style.color = 'red';
            } catch (e) { msg.textContent = 'Không thể kết nối máy chủ.'; msg.style.color = 'red' }
        };
        document.getElementById('verify').onclick = async () => {
            const otp = document.getElementById('otp').value.trim();
            if (!/^\d{6}$/.test(otp)) { msg.textContent = 'Vui lòng nhập đúng 6 chữ số.'; msg.style.color = 'red'; return }
            try {
                const r = await fetch('/verify-login-otp', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ otp }) });
                const d = await r.json(); msg.textContent = d.message || 'Có lỗi xảy ra.';
                if (r.ok && d.success) { msg.style.color = 'green'; location.href = d.redirect || '/login'; }
                else msg.style.color = 'red';
            } catch (e) { msg.textContent = 'Không thể kết nối máy chủ.'; msg.style.color = 'red' }
        };
    </script>
</body>

</html>
